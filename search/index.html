  <script>
  (function(){
    var index=[{"id":"exposure","title":"曝光三角：先把高光保住","summary":"快门、光圈、ISO 不是三个平等旋钮。先定运动，再定景深，最后才用 ISO 救场。","site":"shoot","url":"/article/exposure/"},{"id":"ratio","title":"灯比：先学 ratio，再学灯位","summary":"一盏主灯加一块反光板，已经能拍出大部分人物场景。先控制亮暗差，再追求灯位花样。","site":"shoot","url":"/article/ratio/"},{"id":"composition","title":"构图：先让观众知道看哪里","summary":"观众第一眼该看谁，第二眼该看哪，构图就是排这个顺序。先定主体，再管前中后景。","site":"shoot","url":"/article/composition/"},{"id":"window-light","title":"一扇窗怎么当主光","summary":"没有灯组也能拍人脸：先定朝向，再用反光板补一点，最后把背景压下去。","site":"shoot","url":"/article/window-light/"},{"id":"axis-line","title":"越轴之后，观众会突然找不到方向","summary":"两个人对话，摄影机跨到桌子另一边，观众会以为他们换了位置。先定一条线，再决定要不要跨。","site":"shoot","url":"/article/axis-line/"},{"id":"shot-list","title":"拍摄清单写到别人能替你执行","summary":"清单要写清楚先拍什么、拍多久、拍不到怎么办。想拍的都写上去，现场反而没法执行。","site":"shoot","url":"/article/shot-list/"},{"id":"b-roll","title":"B-roll：让那句话有画面","summary":"受访者说“每天早上五点出摊”，画面还停在脸上，观众就只能听。B-roll 要把这句话变成看得见的东西。","site":"shoot","url":"/article/b-roll/"},{"id":"camera-move","title":"运镜：先问为什么动，再问怎么动","summary":"镜头动起来不难，难的是让观众不觉得摄影机在炫耀。动之前先写清楚：观众要跟着谁、发现什么、被什么压住。","site":"shoot","url":"/article/camera-move/"},{"id":"scene-space","title":"房间先开口：用场景交代人物","summary":"人物还没说话，观众已经在读房间：门口有没有鞋、桌上几只杯子、哪盏灯还亮着。场景不是背景，是第一句台词。","site":"shoot","url":"/article/scene-space/"},{"id":"slate-continuity","title":"场记：每条拍完，都得能接上","summary":"场记不是记时间码。他记的是观众会不会发现：杯子换了手、外套扣错了、太阳突然从另一边来。现场多写一行，剪的时候少找一天。","site":"shoot","url":"/article/slate-continuity/"},{"id":"camera-height","title":"机位高度：蹲下比换镜头有用","summary":"同一张脸，机位高一寸，观众就读成另一个人。高度先决定权力关系，再决定景别；换镜头解决不了站错位置。","site":"shoot","url":"/article/camera-height/"},{"id":"lens-distance","title":"焦距：先决定观众站多远","summary":"广角不是装得下，长焦不是拍得远。焦距先决定观众离人物多远，再决定脸和背景怎么挤。先走位，再换镜头。","site":"shoot","url":"/article/lens-distance/"},{"id":"shot-size","title":"景别：观众该看见多少","summary":"景别不是远景、中景、特写的名词表。它决定观众和人物的距离：看见他站在哪，还是只看见一个眼神。先问这一刀要观众看什么，再决定机位退到哪儿。","site":"shoot","url":"/article/shot-size/"},{"id":"blocking","title":"走位：让人用身体说话","summary":"走位不是把演员摆好看，而是让身体在空间里做出关系：谁靠近、谁退、谁挡住谁。","site":"shoot","url":"/article/blocking/"},{"id":"coverage","title":"覆盖：别只拍一个角度","summary":"覆盖不是多拍几条，而是给剪辑留下能救场的不同信息：全景、近景、插入、反打。","site":"shoot","url":"/article/coverage/"},{"id":"sensor-size","title":"传感器尺寸：画幅决定什么","summary":"传感器尺寸改变的是视角、景深和低光，不是“电影感”本身。","site":"shoot","url":"/article/sensor-size/"},{"id":"waveform","title":"波形图：看曝光，不靠感觉","summary":"波形图看亮度分布，不看画面好不好看；先保高光，再决定暗部留多少。","site":"shoot","url":"/article/waveform/"},{"id":"lighting-style","title":"灯光风格：柔、硬、自然","summary":"灯光风格先选一个方向：柔、硬、自然；三个都要，画面就会没有态度。","site":"shoot","url":"/article/lighting-style/"},{"id":"set-safety","title":"现场安全：电线、高处、道路","summary":"现场安全先看三样：电线会不会绊人、高处有没有固定、道路有没有车。","site":"shoot","url":"/article/set-safety/"},{"id":"frame-rate","title":"帧率：动作与慢动作","summary":"帧率决定动作的时间感；升格不是慢，是让观众看清一个瞬间。","site":"shoot","url":"/article/frame-rate/"},{"id":"shutter-angle","title":"快门角度：运动模糊","summary":"快门角度控制运动模糊；180 度是常态，不是唯一答案。","site":"shoot","url":"/article/shutter-angle/"},{"id":"nd-filter","title":"ND 滤镜：白天大光圈怎么拍","summary":"ND 滤镜不是压暗画面，是让白天也能开大光圈、保住景深。","site":"shoot","url":"/article/nd-filter/"},{"id":"false-color","title":"伪色：一眼看高光","summary":"伪色把亮度分成色块，一眼就能看到脸是不是过曝、天空是不是死了。","site":"shoot","url":"/article/false-color/"},{"id":"log-footage","title":"Log 素材：拍的时候想后期","summary":"Log 不是“灰片更好看”，它把高光和暗部留给后期，前提是曝光和色彩管理做对。","site":"shoot","url":"/article/log-footage/"},{"id":"night-interior","title":"夜景内景：一盏 practical 怎么撑","summary":"夜景内景先找画面里能信的实用光，再用一盏小灯补人脸，别把整间房打平。","site":"shoot","url":"/article/night-interior/"},{"id":"mixed-light","title":"混合光：两种色温别打平","summary":"混合光不要全部打成白；保留窗光冷、灯泡暖，空间才有层次。","site":"shoot","url":"/article/mixed-light/"},{"id":"hard-light","title":"硬光：影子也是构图","summary":"硬光不是“难看”，它用影子划分空间；问题通常出在影子落错地方。","site":"shoot","url":"/article/hard-light/"},{"id":"practical-light","title":"实用光：画面里的灯怎么用","summary":"画面里的灯要真的亮、真的灭、真的闪，但它照不亮整张脸，只能当动机。","site":"shoot","url":"/article/practical-light/"},{"id":"wireless-lav","title":"无线领夹：藏麦与备份","summary":"领夹麦先解决藏和备份：衣领下、头发里、胶带固定，再录一条备用轨。","site":"shoot","url":"/article/wireless-lav/"},{"id":"boom-operator","title":"吊杆操作：跟着动作走","summary":"吊杆跟着动作走，不跟着台词走；台词会停，身体不会。","site":"shoot","url":"/article/boom-operator/"},{"id":"dual-system-sound","title":"双系统录音：合板不靠猜","summary":"双系统录音要么拍手合板，要么时间码同步；两样都没有，后期只能猜。","site":"shoot","url":"/article/dual-system-sound/"},{"id":"handheld","title":"手持：让呼吸进画面","summary":"手持不是乱晃，是把摄影师的呼吸变成节奏；先稳住脚步，再谈晃动。","site":"shoot","url":"/article/handheld/"},{"id":"stabilizer","title":"稳定器：走路的节奏","summary":"稳定器最怕碎步；膝盖微屈、脚跟着地、速度均匀，画面才会稳。","site":"shoot","url":"/article/stabilizer/"},{"id":"set-dressing","title":"陈设：用道具说人物","summary":"陈设不是买一堆好看的东西，而是让每件道具回答“这个人为什么把它留在这里”。","site":"shoot","url":"/article/set-dressing/"},{"id":"prop-continuity","title":"道具连贯：杯子放在哪","summary":"道具连贯靠照片：开机前拍桌面、拍手、拍衣服，收工前再拍一次。","site":"shoot","url":"/article/prop-continuity/"},{"id":"multicam-sync","title":"多机位同步：时间码与机位图","summary":"多机位先画机位图，再对时间码；剪辑要知道哪台机器站在哪。","site":"shoot","url":"/article/multicam-sync/"},{"id":"led-volume","title":"LED 虚拟拍摄：先对跟踪，再对光","summary":"LED 虚拟拍摄先对跟踪，再对光；跟踪漂了，再漂亮的背景也贴不住。","site":"shoot","url":"/article/led-volume/"},{"id":"live-encoding","title":"直播编码：码率、推流、备份","summary":"直播编码先算上行带宽，再定码率；永远留一条本地录制备份。","site":"shoot","url":"/article/live-encoding/"},{"id":"permit","title":"拍摄许可：公园、地铁、商铺","summary":"拍摄许可不是一张纸，它决定你能不能架灯、挡路、拍到招牌。","site":"shoot","url":"/article/permit/"},{"id":"risk-assessment","title":"风险评估：开机前填一张表","summary":"风险评估一页纸：谁可能受伤、什么会掉、出了事谁负责、最近的医院在哪。","site":"shoot","url":"/article/risk-assessment/"},{"id":"multicam-live","title":"多机位与直播：先把时间码、返送和录制锁死","summary":"多机位不是多摆两台机器，而是让三台机器进同一条时间线、同一套返送、同一份录音。任何一个环节没有备份，现场就会从“导播”变成“猜”。","site":"shoot","url":"/article/multicam-live/"},{"id":"led-virtual-production","title":"LED 虚拟拍摄：墙、跟踪、同步与色温","summary":"LED 虚拟拍摄不是“背景换成屏幕”。它把真实光影、相机跟踪、屏幕刷新和后期色彩绑成一条链；任何一项没锁，演员脸上的光就会和背景分开。","site":"shoot","url":"/article/led-virtual-production/"},{"id":"deep-hard-light","title":"现场硬光：硬、混、实用","summary":"硬光不是缺点；问题是硬光、实用光和色温三种来源有没有被安排在同一张脸上。","site":"shoot","url":"/article/deep-hard-light/"},{"id":"deep-sound-rig","title":"声音吊杆：双系统、无线、杆操","summary":"现场声音的可靠性来自双系统、无线备份和杆操位置，不是某一个贵麦克风。","site":"shoot","url":"/article/deep-sound-rig/"},{"id":"deep-camera-move","title":"运镜：手持、稳定器、覆盖","summary":"运镜不是让画面动起来，而是让运动服务走位、覆盖和剪辑点。","site":"shoot","url":"/article/deep-camera-move/"},{"id":"deep-multicam","title":"多机位：同步、覆盖、走位","summary":"多机位不是多开几台机器；同步、景别分工和走位重复，缺一个就剪不起来。","site":"shoot","url":"/article/deep-multicam/"},{"id":"deep-log-exposure","title":"Log 与曝光：波形、假色、ND","summary":"Log 不是万能；曝光、ND 和假色要一起定，否则后期只剩一张灰片。","site":"shoot","url":"/article/deep-log-exposure/"},{"id":"deep-set-safety","title":"现场安全：风险评估、许可、收工","summary":"现场安全不是一张签字表；风险评估、许可和收工检查要落到每一个会动的人。","site":"shoot","url":"/article/deep-set-safety/"},{"id":"deep-interview-light","title":"访谈布光：窗光、单灯与混合光","summary":"访谈布光不是把脸打亮，是让人敢说、让剪辑有反应；先定方向，再定比例，最后才加灯。","site":"shoot","url":"/article/deep-interview-light/"},{"id":"deep-low-light","title":"低照度拍摄：噪点、快门与实用光","summary":"夜景不是把 ISO 拉高，而是先决定哪些黑可以接受，再用实用光和快门换回细节。","site":"shoot","url":"/article/deep-low-light/"}];
    var siteName={"main":"主站","story":"故事","shoot":"拍摄","post":"后期","ai":"AI","animation":"动画","formats":"片型","tools":"工具","context":"影像史"};
    var input=document.getElementById('staticSearchInput');
    var out=document.getElementById('staticSearchResults');
    var defaultBox=document.getElementById('searchDefault');
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function syncQuery(){
      var params=new URLSearchParams(location.search);
      var value=input.value.trim();
      if(value) params.set('q',value); else params.delete('q');
      var query=params.toString();
      try{history.replaceState(null,'',location.pathname+(query?'?'+query:''))}catch(e){}
    }
    function render(){
      var q=input.value.trim().toLowerCase();
      if(defaultBox) defaultBox.style.display=q?'none':'';
      if(!q){out.innerHTML='<p class="search-hint">输入关键词开始搜索。</p>';return}
      var all=index.filter(function(x){return (x.title+' '+x.summary+' '+x.site+' '+x.id).toLowerCase().indexOf(q)>=0}); var hits=all.slice(0,24);
      if(!hits.length){out.innerHTML='<div class="empty"><p class="search-hint">没有匹配的文章。</p></div>';return}
      out.innerHTML='<p class="search-count">'+all.length+' 条结果'+(all.length>24?' （显示前 24 条）':'')+'</p><div class="search-results">'+hits.map(function(x){return '<a class="search-result" href="'+x.url+'"><span class="result-type">'+esc(siteName[x.site]||x.site)+'</span><span><span class="result-title">'+esc(x.title)+'</span><span class="result-summary">'+esc(x.summary)+'</span></span></a>'}).join('')+'</div>';
    }
    function update(){render();syncQuery()}
    input.addEventListener('input',update);
    var initial=new URLSearchParams(location.search).get('q');
    if(initial){input.value=initial;render()}
  })();
  </script>
